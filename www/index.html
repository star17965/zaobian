<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ec">
<title>灶边 · 好好吃饭</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell" id="appShell">
  <main id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab on" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20h-5v-6H9v6H4z"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-nav="explore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
      <span>菜谱</span>
    </button>
    <button class="tab" data-nav="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 4.5h11v15l-5.5-3.7-5.5 3.7z"/></svg>
      <span>收藏</span>
    </button>
    <button class="tab" data-nav="mine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-4 3.2-6 7-6s7 2 7 6"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div id="modal" class="modal"></div>
<div class="toast" id="toast" role="status"></div>

<div class="splash" id="splash">
  <div class="seal">灶</div>
  <div class="name">灶边</div>
  <div class="tag">ZAO BIAN · 好好吃饭</div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
